# Fly.io config — committed, explicit infra config, same spirit as the
# render.yaml this replaces.
#
# region "iad" (Ashburn, Virginia): Fly has no Ohio region; this is the
# closest match to Neon's us-east-2 database, same reasoning as the
# region fix applied on Render.
#
# Scale-to-zero: min_machines_running = 0 + auto_stop/auto_start means the
# app costs nothing in compute while idle between interviews — only the
# small stopped-machine rootfs charge persists (Fly's own phrase: "scale
# to zero is not scale to free"), not ongoing compute billing.
app = "poker-project"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"
