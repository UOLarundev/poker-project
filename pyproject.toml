[project]
name = "poker-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["poker_engine*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]