[project]
name = "poker-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# Dev/test-only tooling — deliberately not in `dependencies` above, so it
# never ships in the Docker image (Dockerfile runs `pip install .`, no
# extra). httpx lives here too: it's only used by FastAPI's TestClient in
# tests, never by the app itself at runtime.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["poker_engine*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
# Depends(...) as a default argument is FastAPI's documented dependency-
# injection mechanism, not the mutable-default footgun B008 exists to catch.
"api/routes/*.py" = ["B008"]